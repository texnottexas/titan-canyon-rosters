<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="referrer" content="no-referrer" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; base-uri 'self'; form-action 'none';" />
  <meta http-equiv="refresh" content="2; url=https://2864tw.com/titan-battle-plan.html" />
  <link rel="canonical" href="https://2864tw.com/titan-battle-plan.html" />
  <title>Titan Canyon has moved · Server 2864</title>
  <style>
    :root{--bg:#0d1117;--card:#1c2128;--border:#30363d;--text:#e6edf3;--muted:#8b949e;--accent:#79c0ff;--green:#3fb950;}
    *{box-sizing:border-box;margin:0;padding:0}
    html,body{height:100%}
    body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;display:flex;align-items:center;justify-content:center;min-height:100vh;padding:24px;line-height:1.5}
    .card{background:var(--card);border:1px solid var(--border);border-radius:14px;max-width:460px;width:100%;padding:36px 30px;text-align:center;box-shadow:0 10px 40px rgba(0,0,0,.45)}
    .badge{display:inline-block;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);border:1px solid var(--border);border-radius:999px;padding:4px 12px;margin-bottom:18px}
    h1{font-size:22px;margin-bottom:10px}
    p{color:var(--muted);font-size:15px;margin-bottom:22px}
    a.btn{display:inline-block;background:var(--green);color:#04130a;font-weight:700;text-decoration:none;padding:12px 22px;border-radius:10px;font-size:15px;transition:filter .15s}
    a.btn:hover{filter:brightness(1.08)}
    .small{margin-top:18px;font-size:13px;color:var(--muted)}
    .small a{color:var(--accent);text-decoration:none}
  </style>
</head>
<body>
  <main class="card">
    <span class="badge">Server 2864 · Titan Canyon</span>
    <h1>This site has moved</h1>
    <p>Titan Canyon now lives on the main 2864tw.com hub. Redirecting you to the battle plan&hellip;</p>
    <a class="btn" href="https://2864tw.com/titan-battle-plan.html">Go to the battle plan</a>
    <div class="small">
      Bookmark the new pages:
      <a href="https://2864tw.com/titan-roster.html">Roster</a> ·
      <a href="https://2864tw.com/titan-battle-plan.html">Battle Plan</a> ·
      <a href="https://2864tw.com/titan-signup.html">Sign up</a>
    </div>
  </main>
</body>
</html>
